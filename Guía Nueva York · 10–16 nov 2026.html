<body>
  <div id="__bundler_placeholder">Loading Nueva York · Guía por días...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

edan fuerzas, caminad por la 7th Avenue hasta Madison Square Park y el Flatiron Building, el famoso edificio en forma de plancha de 1902 que ocupa el cruce de Broadway con la Quinta Avenida. Desde ahí, Union Square queda a unos diez minutos andando.\",\n          \"Times Square puede esperar. Si os apetece una primera dosis de luces, id un rato; si no, mejor dormir bien y empezar fresco el miércoles.\"\n        ],\n        route: [[\"Al llegar\", \"Check-in en Chelsea\", \"Dejad las maletas y salid a estirar las piernas por 7th Avenue.\", \"bag\", P.chelsea], [\"19:30\", \"Cena en Chelsea Market\", \"Puestos para todos los gustos bajo techo: tacos, noodles, ostras.\", \"fork\", P.market], [\"21:00\", \"Flatiron iluminado\", \"Paseo hasta el Flatiron y Madison Square Park de noche, a un cuarto de hora andando.\", \"walk\", P.flatiron], [\"22:00\", \"Times Square de noche\", \"Si aún hay energía, 10 minutos en metro desde la calle 23 para ver las pantallas encendidas.\", \"moon\", P.times]],\n        food: [[\"Los Tacos No. 1\", \"Chelsea Market, 75 9th Ave\", 1, \"Tacos estilo Tijuana; rápido y perfecto para compartir.\"], [\"Very Fresh Noodles\", \"Chelsea Market, 409 W 15th St\", 1, \"Fideos chinos hechos al momento, cocina a la vista.\"], [\"Westville Chelsea\", \"88 7th Ave\", 1, \"Platos de mercado y guarniciones de verduras.\"], [\"Johny's Luncheonette\", \"124 W 25th St\", 1, \"Diner clásico: sándwiches, huevos y comida americana.\"], [\"Cookshop\", \"156 10th Ave\", 2, \"Americano de temporada; buena cena sentados.\"], [\"Cull & Pistol Oyster Bar\", \"Chelsea Market, 75 9th Ave\", 2, \"Ostras y marisco; elegid según apetito.\"], [\"Socarrat Paella Bar\", \"259 W 19th St\", 2, \"Paellas y tapas para compartir.\"], [\"Bar Primi\", \"325 Bowery, NoHo\", 2, \"Pasta e italiano; útil si os movéis hacia el Village.\"], [\"Pastis\", \"52 Gansevoort St\", 3, \"Brasserie francesa muy neoyorquina; reservad.\"], [\"Buddakan\", \"75 9th Ave\", 3, \"Comedor espectacular y platos asiáticos para compartir.\"]] },\n      { id: \"d11\", wd: \"Mié\", n: \"11\", name: \"Miércoles\", bg: \"#DDEFE3\", hero: P.bethesda, heroPos: \"center 50%\", title: \"Central Park y la Quinta Avenida de arriba abajo\", zone: \"Central Park · Quinta Avenida, de la calle 59 a la 23 · Madison Square\",\n        wx: [14, 9, \"Soleado\"],\n        tip: \"De 12:30 a 15:30 el desfile ocupa la Quinta entre las calles 26 y 45 aprox. Vedlo desde la acera y, para seguir bajando, id por Madison o la Sexta Avenida.\",\n        desc: [\n          \"Hoy se baja Manhattan a pie por su avenida más famosa, de Central Park casi hasta casa: unos 3 km de la calle 59 a la 23, con tiempo para pararse. Empezad temprano en el parque. Entrad por el sur y subid por The Mall, el paseo de olmos que lleva a Bethesda Terrace y su fuente del Ángel de las Aguas. Muy cerca están Bow Bridge y Strawberry Fields, el memorial a John Lennon.\",\n          \"Hacia las 11 volved a la esquina sureste del parque, en Grand Army Plaza, con el hotel The Plaza (1907) y la fuente Pulitzer, y empezad a bajar por la Quinta: el cubo de cristal de Apple, Bergdorf Goodman y Tiffany en la calle 57. En la 50 aparecen la catedral neogótica de St Patrick's y, enfrente, Rockefeller Center con los Channel Gardens.\",\n          \"El 11 de noviembre es Veterans Day: a las 12:30 arranca el desfile por la Quinta, con bandas, veteranos y colegios. Buscad sitio en la acera hacia la calle 42, junto a los leones de la New York Public Library, y disfrutadlo; es gratis y muy local. Cuando termine, seguid bajando hasta el Empire State Building en la 34 y acabad al anochecer en el Flatiron y Madison Square Park, a un paseo de Chelsea.\",\n          \"Después de un rato en el hotel, cena por el barrio y remate en un rooftop: desde 230 Fifth, junto a Madison Square, el Empire State iluminado queda justo enfrente.\"\n        ],\n        route: [[\"08:30\", \"Central Park\", \"The Mall, Bethesda Terrace, Bow Bridge y Strawberry Fields. Entrad por el sur y subid hacia Bethesda.\", \"walk\", P.bethesda], [\"11:00\", \"Grand Army Plaza y The Plaza\", \"Punto de partida en la calle 59: el hotel The Plaza, la fuente Pulitzer, el cubo de Apple y Tiffany en la 57.\", \"walk\", P.plaza], [\"11:45\", \"St Patrick's y Rockefeller Center\", \"La catedral neogótica en la calle 50 y, enfrente, los Channel Gardens de Rockefeller Center.\", \"city\", P.stpat], [\"12:30\", \"Veterans Day Parade\", \"Desde la acera hacia la calle 42, junto a la biblioteca. Gratis y muy local; para avanzar, usad Madison o la Sexta.\", \"walk\", P.fifth], [\"15:45\", \"Empire State Building\", \"En la calle 34. Por fuera, o subid al atardecer si habéis reservado.\", \"city\", P.empire], [\"16:45\", \"Flatiron y Madison Square Park\", \"Final del paseo en la calle 23 al anochecer; de aquí a Chelsea, diez minutos andando.\", \"walk\", P.madison], [\"18:00\", \"Descanso en el hotel\", \"Una hora para recargar pilas después de 3 km de Quinta Avenida.\", \"bag\", \"\"], [\"19:30\", \"Cena en Chelsea o Flatiron\", \"Cookshop, Socarrat o, para algo especial, Keens Steakhouse en la calle 36.\", \"fork\", \"\"], [\"21:00\", \"Rooftop con el Empire State\", \"230 Fifth (1150 Broadway), con el Empire State iluminado enfrente. Comprobad edad mínima y consumición.\", \"moon\", P.empire]],\n        food: [[\"Ess-a-Bagel\", \"831 3rd Ave\", 1, \"Bagel generoso con cream cheese, huevo o salmón.\"], [\"The Halal Guys\", \"W 53rd St & 6th Ave\", 1, \"Pollo o gyro con arroz; comida callejera neoyorquina.\"], [\"Los Tacos No. 1\", \"136 W 42nd St\", 1, \"Tacos rápidos por Bryant Park y Times Square.\"], [\"Xi'an Famous Foods\", \"24 W 45th St\", 1, \"Fideos de Xi'an con comino y picante.\"], [\"Burger Joint\", \"119 W 56th St\", 2, \"Hamburguesa clásica en un local pequeño.\"], [\"Urban Hawker\", \"135 W 50th St\", 2, \"Food hall del sudeste asiático; cada uno elige.\"], [\"La Pecora Bianca\", \"20 W 40th St\", 2, \"Pasta e italiano en un comedor animado.\"], [\"Bill's Bar & Burger\", \"16 W 51st St\", 2, \"Hamburguesas y ambiente deportivo junto a Rockefeller.\"], [\"Keens Steakhouse\", \"72 W 36th St\", 3, \"Steakhouse histórico; pedid el mutton chop.\"], [\"The Modern (bar room)\", \"9 W 53rd St\", 3, \"Cocina contemporánea junto al MoMA.\"]] },\n      { id: \"d12\", wd: \"Jue\", n: \"12\", name: \"Jueves\", bg: \"#DCE7F7\", hero: P.grand, heroPos: \"center 55%\", title: \"Día de interiores y museos\", zone: \"Midtown · Bryant Park · Chelsea\",\n        wx: [15, 7, \"Nublado, lluvia por la tarde\"],\n        tip: \"Paraguas y calzado impermeable: la lluvia llega a media tarde. Elegid un solo museo, no intentéis hacer dos.\",\n        desc: [\n          \"La previsión anuncia lluvia desde media tarde, así que hoy toca ver interiores espectaculares. Empezad por la New York Public Library, el edificio de mármol de 1911 custodiado por los leones Patience y Fortitude. Arriba está la Rose Main Reading Room, una sala de lectura enorme con techos pintados (comprobad si está abierta). Al lado, Bryant Park.\",\n          \"A cinco minutos andando está Grand Central Terminal, de 1913. Mirad el techo de constelaciones del vestíbulo principal y el reloj de cuatro caras sobre el mostrador de información. Probad la Whispering Gallery, junto al Oyster Bar: si os ponéis en esquinas opuestas del arco y habláis hacia la pared, os oiréis perfectamente.\",\n          \"Por la tarde, un solo museo: el MoMA si os tira el arte moderno (Van Gogh, Monet, Warhol) o el American Museum of Natural History si preferís dinosaurios y planetario. Por la noche, si la lluvia lo permite, el mercado navideño y la pista de hielo gratuita de Bryant Park Winter Village.\",\n          \"La noche de lluvia es perfecta para Broadway: cena temprana cerca de Grand Central o Bryant Park y un musical a las 20:00 en el Theater District, a pocas calles. Al salir, Times Square encendida queda de camino al metro.\"\n        ],\n        route: [[\"09:30\", \"Desayuno cerca del hotel\", \"Arrancad tranquilos por Chelsea: un diner o un bagel.\", \"cup\", \"\"], [\"10:15\", \"New York Public Library\", \"Salas históricas y Rose Main Reading Room si está abierta.\", \"city\", P.nypl], [\"11:30\", \"Grand Central Terminal\", \"Main Concourse, el reloj, la Whispering Gallery y Vanderbilt Hall.\", \"city\", P.grand], [\"14:30\", \"Un museo grande\", \"MoMA para arte moderno o Natural History para dinosaurios y espacio. Solo uno.\", \"city\", P.moma], [\"17:45\", \"Bryant Park Winter Village\", \"Mercado navideño y pista de hielo gratuita; si llueve, las casetas cubiertas y un chocolate caliente.\", \"walk\", P.bryant], [\"18:45\", \"Cena temprana en Midtown\", \"Grand Central Oyster Bar, Sakagura o La Pecora Bianca, cerca de los teatros.\", \"fork\", \"\"], [\"20:00\", \"Un musical de Broadway\", \"El plan perfecto para una noche de lluvia. Reservad entradas antes; termina hacia las 22:30.\", \"moon\", P.times]],\n        food: [[\"Urbanspace Vanderbilt\", \"230 Park Ave\", 1, \"Varios puestos rápidos junto a Grand Central.\"], [\"Xi'an Famous Foods\", \"45th St, Midtown\", 1, \"Fideos y dumplings; gran relación cantidad-precio.\"], [\"Ess-a-Bagel\", \"831 3rd Ave\", 1, \"Bagels para desayunar o almorzar sin perder tiempo.\"], [\"The Halal Guys\", \"W 53rd St & 6th Ave\", 1, \"Comida rápida local, ideal para llevar.\"], [\"Grand Central Oyster Bar\", \"Grand Central Terminal\", 2, \"Ostras y marisco en una sala histórica.\"], [\"Sakagura\", \"211 E 43rd St\", 2, \"Izakaya japonesa escondida en un edificio de oficinas.\"], [\"Kjun\", \"305 E 41st St\", 2, \"Cocina coreana-cajún informal y distinta.\"], [\"La Pecora Bianca\", \"20 W 40th St\", 2, \"Pasta junto al eje Bryant Park–biblioteca.\"], [\"Benjamin Steakhouse\", \"52 E 41st St\", 3, \"Steakhouse clásico de Midtown.\"], [\"Sushi Yasuda\", \"204 E 43rd St\", 3, \"Sushi serio y tradicional.\"]] },\n      { id: \"d13\", wd: \"Vie\", n: \"13\", name: \"Viernes\", bg: \"#E9E1F5\", hero: P.promenade, heroPos: \"center 50%\", title: \"Lower Manhattan, DUMBO y Williamsburg\", zone: \"Financial District · Staten Island Ferry · DUMBO · Williamsburg\",\n        wx: [8, 4, \"Lluvia probable (70 %)\"],\n        tip: \"Para volver, la línea L va directa de Bedford Av (Williamsburg) a 8th Av/14th St, en Chelsea, en unos 20 minutos. La previsión da lluvia probable hoy: si se confirma, intercambiadlo con el jueves.\",\n        desc: [\n          \"El día del sur de Manhattan y de la vista más famosa de la ciudad. Empezad en Wall Street: el Federal Hall, donde George Washington juró como primer presidente; la Bolsa de Nueva York; Trinity Church y el Charging Bull. El 9/11 Memorial, con sus dos enormes fuentes en la huella de las Torres Gemelas, es un lugar de silencio. El museo requiere más tiempo y puede ser intenso.\",\n          \"Desde Whitehall Terminal sale el Staten Island Ferry, gratis. En unos 25 minutos pasa frente a la Estatua de la Libertad y regala una vista estupenda del skyline. Buscad sitio en la cubierta exterior y volved en el siguiente barco.\",\n          \"Después de comer en Chinatown, cruzad a pie el Brooklyn Bridge, inaugurado en 1883, hacia DUMBO. Al otro lado os espera la foto de Washington Street, con el Manhattan Bridge enmarcado entre edificios de ladrillo, y Brooklyn Bridge Park junto al agua.\",\n          \"Para terminar el día, subid por el río hasta Williamsburg en el NYC Ferry, que sale del muelle de DUMBO y llega a North Williamsburg en unos 15 minutos. Si coincidís con el atardecer, hacia las 16:40, el skyline de Manhattan desde el barco es de lo mejor del viaje. Williamsburg es el Brooklyn más creativo: antiguas fábricas convertidas en lofts, tiendas vintage, cafés y murales. Pasead por Domino Park, en la antigua refinería de azúcar Domino junto al Williamsburg Bridge, y por Bedford Avenue, la calle principal del barrio. Cenad allí y volved en la línea L, que os deja en Chelsea.\",\n          \"Antes de volver, una copa con vistas: la azotea de Westlight, en el hotel William Vale, tiene una de las panorámicas de Manhattan más bonitas de Brooklyn.\"\n        ],\n        route: [[\"09:00\", \"Financial District\", \"Wall Street, Federal Hall, Charging Bull, Trinity Church y el 9/11 Memorial.\", \"city\", P.wall], [\"11:30\", \"Staten Island Ferry\", \"Gratis, unos 25 minutos por trayecto. Cubierta exterior para ver la Estatua de la Libertad.\", \"walk\", P.ferry], [\"13:00\", \"Comida en Chinatown\", \"Dumplings y noodles antes de cruzar el puente.\", \"fork\", P.chinatown], [\"14:15\", \"Brooklyn Bridge a pie\", \"Cruzad hacia DUMBO: Washington Street y Brooklyn Bridge Park para el skyline.\", \"walk\", P.bridge], [\"16:00\", \"NYC Ferry a Williamsburg\", \"Desde el muelle de DUMBO hasta North Williamsburg, unos 15 minutos con vistas al atardecer.\", \"walk\", P.nycferry], [\"16:30\", \"Domino Park y Bedford Ave\", \"El parque de la antigua refinería Domino, el Williamsburg Bridge y las tiendas y cafés de Bedford Avenue.\", \"walk\", P.domino], [\"19:00\", \"Cena en Williamsburg\", \"Peter Luger para un festín de carne, o algo más informal por Bedford Avenue.\", \"fork\", \"\"], [\"21:00\", \"Copa con vistas\", \"Westlight, en la azotea del hotel William Vale (111 N 12th St), con todo Manhattan delante. Comprobad edad mínima.\", \"moon\", P.wburg], [\"22:30\", \"Vuelta en la L\", \"De Bedford Av a 8th Av/14th St, en Chelsea, en unos 20 minutos.\", \"walk\", \"\"]],\n        food: [[\"Xi'an Famous Foods\", \"45 Bayard St, Chinatown\", 1, \"Fideos de Xi'an y platos picantes.\"], [\"Shu Jiao Fu Zhou\", \"295 Grand St, Chinatown\", 1, \"Dumplings y noodles baratos; llevad efectivo.\"], [\"Super Taste\", \"26 Eldridge St, Chinatown\", 1, \"Fideos hechos a mano y dumplings.\"], [\"Thai Sidewalk\", \"100 Front St, DUMBO\", 1, \"Puesto tailandés cerca del agua.\"], [\"Joe's Shanghai\", \"46 Bowery, Chinatown\", 2, \"Xiao long bao y platos para compartir.\"], [\"Uncle Lou\", \"73 Mulberry St, Chinatown\", 2, \"Cantonés familiar, platos al centro.\"], [\"Juliana's Pizza\", \"19 Old Fulton St, DUMBO\", 2, \"Pizza al horno de carbón; suele haber espera.\"], [\"Westville DUMBO\", \"81 Washington St, DUMBO\", 2, \"Americano informal y verduras de mercado.\"], [\"Celestine\", \"1 John St, DUMBO\", 3, \"Mediterráneo con vistas al East River.\"], [\"Gage & Tollner\", \"372 Fulton St, Brooklyn\", 3, \"Restaurante histórico; marisco y carne.\"], [\"Altbau Bakery\", \"184 N 8th St, Williamsburg\", 1, \"Nuevo este otoño: panadería del cofundador de Tartine, con pan, sándwiches y pizza. Precio estimado.\"], [\"Coniglio's Di Napoli\", \"Williamsburg\", 2, \"Nuevo este otoño: pizza y clásicos italoamericanos. Precio estimado.\"], [\"Peter Luger Steak House\", \"178 Broadway, Williamsburg\", 3, \"Steakhouse mítico desde 1887; porterhouse para compartir. Reservad.\"]] },\n      { id: \"d14\", wd: \"Sáb\", n: \"14\", name: \"Sábado\", bg: \"#FBEFC9\", hero: P.harlem, heroPos: \"center 45%\", title: \"Central Park, Harlem y las escaleras del Bronx\", zone: \"Central Park · Harlem · Highbridge y Yankee Stadium (Bronx)\",\n        wx: [6, 3, \"Parcialmente soleado, frío\"],\n        tip: \"Anochece hacia las 16:40: id a las escaleras del Bronx con luz de día. Línea 4 de 125 St a 167 St, unos 15 minutos. Guantes y gorro.\",\n        desc: [\n          \"Sábado frío, con 6 °C de máxima, para combinar parque y uno de los barrios con más alma de la ciudad. Volved a Central Park por el lado oeste y recorred lo que quedó pendiente: Bow Bridge, el Lago y, si apetece caminar, el Reservoir, con el skyline reflejado en el agua. En noviembre no hay béisbol, pero en North Meadow suele haber partidos de fútbol y flag football.\",\n          \"Hacia las doce y media, subid en metro a Harlem para comer chicken & waffles, el plato emblema de la soul food: Amy Ruth's es el clásico. Después, caminad por la calle 125 hasta el Apollo Theater, el escenario donde empezaron Ella Fitzgerald y tantos grandes de la música afroamericana.\",\n          \"Seguid por las brownstones de Frederick Douglass Boulevard y Malcolm X Boulevard. Tratad Harlem como lo que es, un barrio residencial con mucha vida, no un decorado.\",\n          \"A media tarde, cruzad al Bronx en la línea 4: en 15 minutos estáis en las escaleras de la película Joker, en West 167th Street, entre Shakespeare Avenue y Anderson Avenue. Es una escalera pública entre bloques de ladrillo, perfecta para la foto. Id con luz y con respeto: es una calle residencial y los vecinos se han quejado de las aglomeraciones. A cinco minutos andando está el Yankee Stadium, que merece verse por fuera.\",\n          \"De vuelta en Harlem, cuando anochezca, refugiaos del frío en el Studio Museum in Harlem, reabierto en un edificio nuevo en la calle 125. Después, cena de soul food en Red Rooster o Sylvia's y, para terminar, jazz en directo: Harlem es una de las cunas del género.\"\n        ],\n        route: [[\"09:00\", \"Central Park\", \"Bow Bridge, el Lago y el Reservoir con el skyline reflejado. En North Meadow suele haber partidos de fútbol.\", \"walk\", P.bow], [\"12:30\", \"Chicken & waffles\", \"Amy Ruth's, en la calle 116, es el clásico; Melba's, la alternativa de brunch.\", \"fork\", \"\"], [\"13:45\", \"Apollo Theater y la calle 125\", \"El Apollo, la calle 125 y las brownstones de Malcolm X y Frederick Douglass Blvd.\", \"walk\", P.apollo], [\"15:00\", \"Escaleras del Joker\", \"W 167th St, entre Shakespeare y Anderson Ave (Bronx). Línea 4 hasta 167 St. Con luz de día y con respeto: es una calle residencial.\", \"walk\", P.joker], [\"15:45\", \"Yankee Stadium\", \"A 5 minutos andando: el estadio de los Yankees por fuera. Desde 161 St, la línea 4 os devuelve a Harlem.\", \"ball\", P.yankee], [\"16:45\", \"Studio Museum in Harlem\", \"Arte afroamericano en su edificio nuevo de la calle 125; buen refugio del frío al anochecer. Revisad horario.\", \"city\", P.harlem], [\"19:00\", \"Cena en Red Rooster o Sylvia's\", \"Soul food con ambiente; en Red Rooster reservad.\", \"fork\", \"\"], [\"20:30\", \"Jazz en Harlem\", \"Harlem es cuna del jazz: buscad un club con música en directo esa noche. Revisad calendario y consumición mínima.\", \"moon\", P.apollo]],\n        food: [[\"Amy Ruth's\", \"113 W 116th St\", 1, \"Chicken & waffles y raciones abundantes.\"], [\"Jacob Restaurant\", \"373 Malcolm X Blvd\", 1, \"Buffet de soul food y caribeño, se paga al peso.\"], [\"Manna's Soul Food\", \"320 St Nicholas Ave\", 1, \"Comida casera tipo buffet.\"], [\"Charles Pan-Fried Chicken\", \"340 W 145th St\", 1, \"Pollo frito a la sartén y guarniciones sureñas.\"], [\"Sylvia's\", \"328 Malcolm X Blvd\", 2, \"Institución de soul food con ambiente.\"], [\"Melba's\", \"300 W 114th St\", 2, \"Chicken & waffles y cocina sureña.\"], [\"BLVD Bistro\", \"2149 Frederick Douglass Blvd\", 2, \"Soul food actual: shrimp & grits y pollo.\"], [\"Chocolat\", \"2223 Frederick Douglass Blvd\", 2, \"Brunch con toques caribeños y sureños.\"], [\"Red Rooster\", \"310 Lenox Ave\", 3, \"Cocina de Marcus Samuelsson y música; reservad.\"], [\"Vinatería\", \"2211 Frederick Douglass Blvd\", 3, \"Italo-etíope contemporáneo; cena especial.\"]] },\n      { id: \"d15\", wd: \"Dom\", n: \"15\", name: \"Domingo\", bg: \"#F8DDE4\", hero: P.wsq, heroPos: \"center 50%\", title: \"Village, SoHo, Little Italy, Chinatown y Katz's\", zone: \"West Village · SoHo · Little Italy · Chinatown · Lower East Side\",\n        wx: [9, 4, \"Mayormente soleado\"],\n        tip: \"En Katz's os dan un ticket al entrar: no lo perdáis, se paga con él al salir. Id fuera de horas punta.\",\n        desc: [\n          \"Domingo para callejear sin reloj por el Downtown con más encanto. Empezad en Washington Square Park, con su arco de mármol y sus músicos callejeros, y perdeos por las calles arboladas del West Village: Bleecker, Grove o Bedford Street.\",\n          \"A mediodía, SoHo, con una de las mayores concentraciones de edificios de hierro fundido del mundo y sus escaleras de incendios en fachada; Greene Street es la más bonita. Seguid hacia Little Italy: Mulberry Street, con sus manteles de cuadros y sus luces colgadas, y un cannoli en Ferrara, la pastelería de Grand Street abierta desde 1892. A dos calles empieza Chinatown: Mott Street, la curva de Doyers Street y dumplings para picar.\",\n          \"Por la tarde, Katz's Delicatessen en el Lower East Side, abierto desde 1888: pedid el pastrami on rye con mostaza, que es enorme y se comparte bien. Si os queda energía por la noche, jazz en directo: el Village Vanguard lleva programando desde 1935. Y para cerrar, una porción de Joe's Pizza de pie, como buenos neoyorquinos.\"\n        ],\n        route: [[\"09:30\", \"Washington Square y West Village\", \"El arco, calles arboladas y brownstones de Bleecker, Grove y Bedford St.\", \"walk\", P.wsq], [\"11:30\", \"SoHo\", \"Fachadas de hierro fundido en Greene y Mercer St, y tiendas de Broadway y Prince St.\", \"walk\", P.soho], [\"13:00\", \"Little Italy\", \"Mulberry Street y un cannoli en Ferrara (Grand St), desde 1892.\", \"walk\", P.littleitaly], [\"14:00\", \"Chinatown\", \"Mott St, Doyers St y Columbus Park. Dumplings en Shu Jiao Fu Zhou o xiao long bao en Joe's Shanghai.\", \"noodle\", P.chinatown], [\"15:30\", \"Katz's Delicatessen\", \"Fuera de la hora punta. Pastrami on rye con mostaza: compartidlo.\", \"sandwich\", P.katz], [\"17:00\", \"Lower East Side y Nolita\", \"Tiendas pequeñas, cafés y bares de toda la vida mientras baja el pastrami.\", \"walk\", \"\"], [\"20:30\", \"Jazz en el Village Vanguard\", \"El club de jazz más mítico, desde 1935. Reservad entradas para el primer pase.\", \"moon\", P.vanguard], [\"22:30\", \"Porción de despedida\", \"Joe's Pizza, en Carmine St, abre hasta tarde: una slice de pie para cerrar el día.\", \"pizza\", P.joes]],\n        food: [[\"Joe's Pizza\", \"7 Carmine St\", 1, \"La porción neoyorquina clásica, de pie.\"], [\"Mamoun's Falafel\", \"119 MacDougal St\", 1, \"Falafel y shawarma rápidos y baratos.\"], [\"Prince Street Pizza\", \"27 Prince St\", 1, \"La porción cuadrada de pepperoni; suele haber cola.\"], [\"Shu Jiao Fu Zhou\", \"295 Grand St\", 1, \"Dumplings y peanut noodles.\"], [\"Katz's Delicatessen\", \"205 E Houston St\", 2, \"Pastrami caliente; institución desde 1888.\"], [\"Spicy Village\", \"68 Forsyth St\", 2, \"Cocina de Henan: big tray chicken.\"], [\"Uncle Lou\", \"73 Mulberry St\", 2, \"Cantonés familiar para compartir.\"], [\"Faicco's\", \"260 Bleecker St\", 2, \"Deli italiano de bocadillos enormes.\"], [\"Via Carota\", \"51 Grove St\", 3, \"Italiano muy querido; suele haber espera.\"], [\"L'Artusi\", \"228 W 10th St\", 3, \"Pasta contemporánea; reservad con antelación.\"]] },\n      { id: \"d16\", wd: \"Lun\", n: \"16\", name: \"Lunes\", bg: \"#E2EEF0\", hero: P.highline, heroPos: \"center 50%\", title: \"Meatpacking, High Line y despedida\", zone: \"Meatpacking District · Little Island · High Line · Hudson Yards\",\n        wx: [9, 3, \"Mayormente nublado\"],\n        tip: \"Dejad las maletas en el hotel tras el check-out y salid hacia el aeropuerto con margen amplio.\",\n        desc: [\n          \"Última mañana, tranquila y a un paseo del hotel. Tras el check-out, dejad las maletas en recepción y bajad al Meatpacking District: calles adoquinadas donde hace un siglo había más de 250 mataderos y almacenes de carne, hoy convertidos en tiendas, restaurantes y terrazas. Allí está el Whitney Museum, el edificio de Renzo Piano que marca el inicio de la High Line.\",\n          \"Cruzad al río para ver Little Island, el parque sobre pilotes en forma de tulipán que se abrió en 2021 sobre el Hudson. Después, subid a la High Line en Gansevoort Street y recorredla hacia el norte: unos 2,3 km de jardines y arte sobre una antigua vía de tren de mercancías, con vistas a las calles de Chelsea, hasta Hudson Yards.\",\n          \"Al final de la High Line os espera Mercado Little Spain para comer, y de ahí al hotel a por el equipaje. Al aeropuerto, salid con margen: el tráfico de Nueva York un lunes puede alargar mucho el trayecto.\"\n        ],\n        route: [[\"09:00\", \"Desayuno y check-out\", \"Dejad las maletas guardadas en el hotel.\", \"bag\", \"\"], [\"09:45\", \"Meatpacking District\", \"Calles adoquinadas, antiguos almacenes de carne y el Whitney Museum, al pie de la High Line.\", \"walk\", P.meat], [\"10:30\", \"Little Island\", \"El parque flotante sobre el Hudson, frente a la calle 13.\", \"walk\", P.littleisland], [\"11:00\", \"High Line hasta Hudson Yards\", \"De Gansevoort St a la calle 34, unos 2,3 km sin prisas.\", \"walk\", P.highline], [\"12:30\", \"Comida en Mercado Little Spain\", \"Al final de la High Line, en Hudson Yards. Después, al hotel a por el equipaje.\", \"fork\", \"\"]],\n        food: [[\"Los Tacos No. 1\", \"Chelsea Market, 75 9th Ave\", 1, \"Tacos estilo Tijuana, rápidos y sabrosos.\"], [\"Very Fresh Noodles\", \"Chelsea Market\", 1, \"Fideos chinos hechos al momento.\"], [\"Westville Chelsea\", \"88 7th Ave\", 1, \"Comfort food americano y verduras.\"], [\"Dickson's Farmstand Meats\", \"Chelsea Market\", 1, \"Hamburguesas y bocados de carne.\"], [\"Cull & Pistol\", \"Chelsea Market\", 2, \"Ostras, lobster roll y marisco.\"], [\"Mercado Little Spain\", \"10 Hudson Yards\", 2, \"Tapas, bocadillos y churros.\"], [\"Cookshop\", \"156 10th Ave\", 2, \"Americano de temporada para sentarse.\"], [\"Bubby's\", \"73 Gansevoort St\", 2, \"Brunch, pancakes y comfort food.\"], [\"Pastis\", \"52 Gansevoort St\", 3, \"Brasserie francesa de Meatpacking.\"], [\"Zou Zou's\", \"385 9th Ave\", 3, \"Levantino moderno; buena cena de despedida.\"]] }\n    ];\n    const hacks = [\n      [\"Staten Island Ferry, gratis\", \"Sale de Whitehall Terminal. Unos 25 minutos por sentido, todo el año. No para en Liberty Island: es para ver la Estatua desde el agua.\", P.ferry, \"\"],\n      [\"Roosevelt Island Tramway\", \"Teleférico urbano sobre el E
